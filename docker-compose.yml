services:
  mongo:
    image: mongo:8
    container_name: devmock-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: devmock-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/devmock
      JWT_SECRET: change-this-in-production
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

  client:
      build: ./client
      container_name: devmock-client
      restart: unless-stopped
      ports:
        - "5173:5173"
      volumes:
        - ./client:/app
        - /app/node_modules
      environment:
        VITE_API_URL: http://localhost:5000
      depends_on:
        - server

volumes:
  mongo_data:
